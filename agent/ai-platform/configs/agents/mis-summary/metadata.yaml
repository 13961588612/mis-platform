metadata:
  name: mis-summary
  display_name: MIS 摘要助手
  description: >
    MIS 平台结构化摘要助手，将业务记录压缩为要点清单，并要求结构化 JSON 输出。
  version: "1.0.0"
  # R3 灰度下线：能力已迁至 mis-user-helper，从全局 catalog 剔除（enabled:false），
  # 暂不物理删除配置（保留以回滚）。此文件为迁移备注，非硬编码调用点。
  enabled: false
  tags:
    - mis
    - summary
  capabilities:
    - summary

  # ---------------------------------------------------------------------------
  # Coordinator–Worker 委派契约（spec.md §4.2 / design-impl.md §6 T04）
  # 与 mis-rag 的边界：只对「已给定文本」做归纳，绝不发起知识库检索。
  # ---------------------------------------------------------------------------
  when_to_use: 对已给定的业务记录或审批意见做要点归纳；不做检索、不抽字段
  input_contract:
    - user_question
    - attachments_text
    - page_context_slice
  output_contract: json
  safety_level: read_only
