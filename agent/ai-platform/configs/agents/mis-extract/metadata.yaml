metadata:
  name: mis-extract
  display_name: MIS 信息抽取助手
  description: >
    MIS 业务表单辅助录入 Worker：按绑定 Skill 从文档/图片/对话抽取字段 JSON。
  version: "1.1.0"
  # 填单页直连本 Agent（createChatSession）。不要加入 mis-copilot worker_ids
  # （R3：Copilot 不再委派抽取；全员抽取/摘要仍走 mis-user-helper）。
  enabled: true
  tags:
    - mis
    - extract
    - form-assist
  capabilities:
    - extract

  # ---------------------------------------------------------------------------
  # 与 mis-summary：抽字段 JSON，不是要点摘要。
  # 与 mis-user-helper：本 Agent 只服务表单注册绑定的 Skill，不进 Copilot 委派。
  # ---------------------------------------------------------------------------
  when_to_use: 业务表单辅助录入；按 schema.fields[].key 与已绑定 Skill 抽取 JSON 字段
  input_contract:
    - user_question
    - attachments_text
    - page_context_slice
  output_contract: json
  safety_level: read_only
