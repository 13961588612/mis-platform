metadata:
  name: mis-extract
  display_name: MIS 信息抽取助手
  description: >
    MIS 平台表单信息抽取助手，按 schema 从文本中抽取字段值，并要求结构化 JSON 输出。
  version: "1.0.0"
  # R3 灰度下线：能力已迁至 mis-user-helper，从全局 catalog 剔除（enabled:false），
  # 暂不物理删除配置（保留以回滚）。此文件为迁移备注，非硬编码调用点。
  enabled: false
  tags:
    - mis
    - extract
  capabilities:
    - extract

  # ---------------------------------------------------------------------------
  # Coordinator–Worker 委派契约（spec.md §4.2 / design-impl.md §6 T04）
  # 与 mis-summary 的边界：抽取「字段值」而非「要点」，输出为 JSON 字段表。
  # ---------------------------------------------------------------------------
  when_to_use: 从已给定文本中按字段名抽取结构化字段值；不做检索、不做摘要
  input_contract:
    - user_question
    - attachments_text
    - page_context_slice
  output_contract: json
  safety_level: read_only
