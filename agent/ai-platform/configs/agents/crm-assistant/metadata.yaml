# =============================================================================
# crm-assistant — AgentRouter 元数据（供语义检索与路由匹配）
# =============================================================================

metadata:
  name: crm-assistant
  display_name: CRM 智能助手
  description: >
    企业 CRM 领域的智能助手，帮助业务人员查询会员信息、积分与等级、
    管理客户标签、查看客户画像与营销活动，并分析客户旅程。
  version: "1.0.0"
  enabled: true
  tags:
    - crm
    - 会员管理
    - 客户运营
    - 积分
    - 营销
  capabilities:
    - query_member
    - query_member_points
    - adjust_member_points
    - query_member_tier
    - update_member_tags
    - query_member_profile
    - query_marketing_campaigns
    - query_customer_journey

  # ---------------------------------------------------------------------------
  # Coordinator–Worker 委派契约（spec.md §4.2 / design-impl.md §6 T04）
  # safety_level=needs_hitl：具备 adjust_member_points / update_member_tags 等
  # 写能力，按 spec.md §8 必须人工确认，且不参与 C5 并行委派（强制串行）。
  # ---------------------------------------------------------------------------
  when_to_use: 会员、积分、等级、标签、客户画像与营销活动等 CRM 业务数据查询
  input_contract:
    - user_question
    - page_context_slice
  output_contract: text
  safety_level: needs_hitl
