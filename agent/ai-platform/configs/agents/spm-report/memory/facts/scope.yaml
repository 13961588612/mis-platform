# =============================================================================
# scope.yaml — 超市报表域边界事实
# =============================================================================

scope:
  description: 超市报表智能体知识边界（B 线 MCP 主路径）

  in_scope:
    - 超市门店经营总览（销售/毛利/损耗/促销）
    - 折扣/出清/供应商分担/生命周期/经销联营
    - 门店与品类库存订货（周/月）
    - 门店内品类结构
    - 权限门店 / 区域 / 分类维表 / ADS 日周月日历
    - 报表口径说明与字段解读（有 Skill 时）

  out_of_scope:
    - 百购商场经营问数（→ bgbh-analyst）
    - WrenAI/NL2SQL 自由问数（→ spm-analyst，**当前暂停**）
    - 采购合同 / 财务总账等未上线 MCP
    - CRM 会员积分券（→ crm-assistant）
    - 制度条款检索（→ mis-rag）

  notes:
    - 经营日数据为 T+1：不提供当天及之后；命中则早停话术，禁止空转工具链
    - 库存类 API 仅 week/month；日粒度无库存表时说明并改问周/月
    - 2026-11：产品决策主推 B 线（本 Agent），A 线 spm-analyst 暂停
