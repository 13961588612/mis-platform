# =============================================================================
# scope.yaml — 超市报表域边界事实
# =============================================================================

scope:
  description: 超市报表智能体知识边界

  in_scope:
    - 超市经营报告 / 门店报告 / 品类结构报表（Skill 上线后）
    - 报表口径说明与字段解读（有 Skill / 事实条目时）

  out_of_scope:
    - 百购商场经营问数（→ bgbh-analyst）
    - 超市即时问数（营业额/生鲜报损/会员占比等 → spm-analyst，项目 sm-data）
    - CRM 会员积分券（→ crm-assistant）
    - 制度条款检索（→ mis-rag）

  notes:
    - 当前 enabled-skills 为空；无 Skill 时不得臆造报表数据
