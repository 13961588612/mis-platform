# 委派闸门（可派名单 / 硬委派 / 透传）
role: coordinator
routing_enabled: false
delegation:
  spawn_tools_enabled: true
  enforce_task_brief: true
  max_depth: 1
  timeout_seconds: 1680
  emit_dispatch_trace: true
  forbid_self_invoke: true
  worker_ids:
    - template-report
    - crm-assistant
    - mis-rag
    - spm-report
  passthrough_workers:
    - template-report
    - spm-report
  hard_dispatch_workers:
    # 模板报告不走首步探测；若需硬委派可把 template-report 加入本列表
    - spm-report
