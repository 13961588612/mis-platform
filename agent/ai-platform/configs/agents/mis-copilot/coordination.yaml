# 委派闸门（可派名单 / 硬委派 / 透传）
role: coordinator
routing_enabled: false
delegation:
  spawn_tools_enabled: true
  enforce_task_brief: true
  max_depth: 1
  timeout_seconds: 1680
  emit_dispatch_trace: true
  forbid_self_invoke: true
  worker_ids:
    - template-report
    - crm-assistant
    - mis-rag
    - spm-report
  passthrough_workers:
    - template-report
    - spm-report
  hard_dispatch_workers:
    # 日/周/月报规则或 JEV 命中 template-report 后直达开卡快路径（跳过选人 LLM）
    - template-report
    - spm-report
