agent:
  name: mis-copilot
  display_name: MIS 智能对话助手（Copilot）
  description: MIS 业务前端通用对话助手（Coordinator）。
  version: 1.0.0
  tags: [mis, copilot, chat]
  role: coordinator
  includes:
    runtime: runtime/runtime.yaml
    system: system/model.yaml
  routing:
    enabled: false
    priority: 10
    keywords: []
  memory:
    static:
      enabled: true
      personality: memory/personality.md
      facts_dir: memory/facts/
    dynamic:
      enabled: true
      collection: agent_memory_index
      top_k: 5
      write_back: true
      ttl_days: 30
      max_per_user: 200
  push:
    enabled: false
    channels: []
