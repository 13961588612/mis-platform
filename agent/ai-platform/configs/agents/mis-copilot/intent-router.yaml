# =============================================================================
# mis-copilot — Coordinator 意图预路由（JEV 选 Worker）
# =============================================================================
# enabled=true 且配置 INTENT_DETECT_API_KEY 后，在主模型组 TaskBrief 前跑 JEV。
# description 会原样进入 JEV 标签表；短跟问依赖运行时传入的对话上文。
# Worker 侧请用 engine=rules（见 spm-report/intent-router.yaml）。
# =============================================================================
intent_router:
  enabled: true
  engine: model
  on_fail: fallback_primary
  # JEV 只带最近 N 轮（user+assistant）；过长会话全量上文易把跟问误判成 rag
  max_context_turns: 3
  max_context_msg_chars: 240
  model:
    name: tongyi-intent-detect-v3
    timeout_ms: 2000
  labels:
    rag:
      worker_id: mis-rag
      intent: rag
      description: >-
        制度/规章/政策/知识库问答与条文检索；
        绝不提供任何销售/毛利/损耗/品类/会员/订单/账户等数据。
    crm:
      worker_id: crm-assistant
      intent: crm
      description: >-
        客户/CRM 业务助理，只处理会员相关业务：某个会员的 个人资料、积分、券、订单、交易明细等。
    spm_report:
      worker_id: spm-report
      intent: spm_report
      description: >-
        分类级别（部门/柜组/大类/中类/小类）；
        超市/大统华经营与主数据：区域或城市有哪些门店、权限可见门店、门店列表、
        门店级的销售/营业额/毛利/损耗/品类/周月报表；门店各分类级别/分类的销售/营业额/毛利/损耗/品类/周月报表；
    chitchat:
      worker_id: ""
      intent: chitchat
      description: >-
        纯闲聊寒暄、与业务系统无关的闲谈；
        「需要」「好的」「确认」「要」等应根结合上下文建议等一起判定意图。
