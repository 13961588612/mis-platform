# 选人：规则优先 → 未命中再 JEV（DECISION_MODEL_*）
intent_router:
  enabled: true
  engine: rules_then_model
  on_fail: fallback_primary
  min_confidence: 0.6
  max_context_turns: 3
  max_context_msg_chars: 160
  model:
    name: decision-model-preview
    timeout_ms: 2000
  rules: []
  labels:
    spm_report:
      worker_id: spm-report
      intent: spm_report
      description: >-
        超市/大统华：地区有哪些门店、门店列表、销售/毛利/客流/品类、日周月报表、区域跟问（金坛呢/溧阳呢）。
        反例：制度条文、会员积分、闲聊。
    rag:
      worker_id: mis-rag
      intent: rag
      description: >-
        仅制度/规章/政策/流程。严禁：门店清单、区域有哪些店、销售/毛利/报表数字。
    crm:
      worker_id: crm-assistant
      intent: crm
      description: >-
        会员/积分/券/CRM。反例：门店报表、制度知识库。
    chitchat:
      worker_id: ""
      intent: chitchat
      description: >-
        纯闲聊。短确认（需要/好的）须结合上文；上文是报表建议则不要选本标签。
