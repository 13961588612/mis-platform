runtime:
  type: openharness
  version: "1.0.0"
  # 协调者：LLM 只见决策工具；agent__invoke 留给系统硬委派 / 决策后执行。
  allowed_tools:
    - coordinator__decide
    - agent__invoke
  params:
    maxSteps: 30
    temperature: 0.3
    maxTokens: 4096
    # A2UI 通道还会合并 Gateway 注入的 render_a2ui；用黑名单从「交给 LLM 的 tools」剔除。
    excludeLlmTools:
      - render_a2ui
      - formfill__execute
      - formfill__apply
      - skill
      - agent__invoke
  prompts:
    system: runtime/prompts/system.md
  middleware: {}
