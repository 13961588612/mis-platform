server:
  port: 8110

spring:
  application:
    name: recon-service

  # ---------- 平台库（recon database，HikariCP）----------
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:recon}
    username: ${DB_USER:recon}
    password: ${DB_PASSWORD:recon123}
    hikari:
      pool-name: reconHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # ---------- JSON 契约（G3）：全局 snake_case，与库字段名/需求说明书字段名三层一致 ----------
  jackson:
    property-naming-strategy: SNAKE_CASE

  # ---------- JPA（平台库配置/查询；ddl 一律 none，改表只走 Flyway）----------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

  # ---------- Flyway（平台库迁移；schema 由 recon 库 owner 拥有）----------
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    validate-on-migrate: true

  # ---------- Quartz（JDBC JobStore，QRTZ_ 表由 Flyway 建，绝不自动初始化）----------
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    auto-startup: ${mis.recon.scheduler.enabled}
    properties:
      org.quartz.scheduler.instanceName: reconScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: false
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 5
      org.quartz.threadPool.threadPriority: 5

  # ---------- 邮件（保留 starter，占位；未配置时发送方降级为日志）----------
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

  cloud:
    loadbalancer:
      enabled: true

# ---------- 业务开关与占位（密钥只写 ${ENV}，不写真实值）----------
mis:
  recon:
    scheduler:
      # 调度总开关：默认 true（T02 建表后 QRTZ_* 已就绪）；环境变量 RECON_SCHEDULER_ENABLED 可覆盖
      enabled: ${RECON_SCHEDULER_ENABLED:true}
    notify:
      mail:
        to: ${RECON_NOTIFY_MAIL_TO:}
      webhook:
        url: ${RECON_NOTIFY_WEBHOOK_URL:}
    async:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 200
    cors:
      allowed-origins: ${RECON_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:5176}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mis.recon: INFO
    org.springframework.scheduling.quartz: INFO
