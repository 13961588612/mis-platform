# Nacos config: mis-auth (test)
server:
  port: 8101

mis:
  auth:
    captcha-enabled: ${AUTH_CAPTCHA_ENABLED:true}
    captcha-ttl-seconds: 300
    captcha-length: 4
    captcha-chars: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
    max-login-failures: 5
    login-lock-seconds: 1800
    default-client-id: web
    refresh-cookie-prefix: mis_refresh_
    cookie:
      path: /
      same-site: Strict
      secure: ${AUTH_COOKIE_SECURE:false}
    audit-enabled: true
    audit-discovery-enabled: true
    audit-service-id: mis-audit
    audit-base-url: http://mis-audit:8106
    iam-discovery-enabled: true
    iam-service-id: mis-iam
    iam-base-url: http://mis-iam:8102
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      access-token-ttl-seconds: 7200
      refresh-token-ttl-seconds: 604800
