# Nacos config: mis-kb (test)
# Knowledge base service (T8 engine connection config, see docs/backend/mis-kb-system-design.md S-04).
#
# test defaults to noop: main flow runs without deploying a RAGFlow instance
# (create/upload return placeholder ref, retrieve returns empty hits, health stays green).
# To use a real engine, set type=ragflow and fill in base-url / api-key.
server:
  port: 8108

mis:
  kb:
    iam:
      base-url: ${MIS_KB_IAM_BASE_URL:http://mis-iam:8102}
    engine:
      type: ${MIS_KB_ENGINE_TYPE:noop}
      base-url: ${MIS_KB_ENGINE_BASE_URL:}
      api-key: ${MIS_KB_ENGINE_API_KEY:}
      # Global rerank model; empty = disabled. Set e.g. qwen3-rerank when integrating ragflow
      rerank-model-id: ${MIS_KB_RERANK_MODEL_ID:}
