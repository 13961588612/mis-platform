# 复制到各微服务 src/main/resources/bootstrap.yml，并修改 spring.application.name
#
# 默认连 Nacos（MIS_REMOTE 默认 true）。纯本地不连 Nacos 时显式设 MIS_REMOTE=false
# remote：MIS_REMOTE=true（默认）+ NACOS_NAMESPACE + NACOS_SERVER

spring:
  application:
    name: mis-example
  cloud:
    nacos:
      config:
        enabled: ${MIS_REMOTE:true}
        server-addr: ${NACOS_SERVER:10.254.16.6:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_CONFIG_GROUP:MIS_GROUP}
        file-extension: yaml
        shared-configs:
          - data-id: mis-common
            group: ${NACOS_CONFIG_GROUP:MIS_GROUP}
            refresh: true
        extension-configs:
          - data-id: ${spring.application.name}
            group: ${NACOS_CONFIG_GROUP:MIS_GROUP}
            refresh: true
      discovery:
        enabled: ${MIS_REMOTE:true}
        server-addr: ${NACOS_SERVER:10.254.16.6:8848}
        namespace: ${NACOS_NAMESPACE:dev}
