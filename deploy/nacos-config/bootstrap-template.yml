# Copy to each service src/main/resources/bootstrap.yml and set spring.application.name
#
# MIS_REMOTE=true (default) connects Nacos; local must set MIS_REMOTE=false
# Config payloads: application.yml spring.config.import (Boot 3 ConfigData)
# remote: NACOS_NAMESPACE=test|prod|integration + NACOS_SERVER
# auth: NACOS_USERNAME / NACOS_PASSWORD

spring:
  application:
    name: mis-example
  cloud:
    nacos:
      config:
        enabled: ${MIS_REMOTE:true}
        server-addr: ${NACOS_SERVER:10.254.16.6:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_CONFIG_GROUP:MIS_GROUP}
        file-extension: yaml
      discovery:
        enabled: ${MIS_REMOTE:true}
        server-addr: ${NACOS_SERVER:10.254.16.6:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
