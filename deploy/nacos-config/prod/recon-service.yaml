# Nacos config: recon-service (prod, S1 bare-metal 10.254.26.33)
#
# 重要：本服务会同时加载 shared-config `mis-common`，其中 datasource 指向 mis_platform 库
# （用户 mis）。这里必须**整体覆盖** datasource 为 recon 库，否则会连错库。
# 优先级：extension-config（本文件）> shared-config（mis-common）> JAR 内 application.yml。
#
# 库账号见下方 spring.datasource（recon / 同 S4 实例），与 mis-common.yaml 的明文写法一致。

server:
  port: 8111

spring:
  datasource:
    url: "jdbc:postgresql://10.254.26.36:5432/recon?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10"
    username: recon
    # 密码含 #，必须加引号（与 mis-common.yaml 同一库的写法保持一致）
    password: "recon#1014"
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: reconHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: "SELECT 1"
      connection-init-sql: "SET application_name = '${spring.application.name}'"

  # 平台库迁移：首次启动自动建表（QRTZ_ 表亦由 Flyway 建，Quartz 绝不自动初始化）
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    baseline-on-migrate: false
    validate-on-migrate: true

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    auto-startup: ${RECON_SCHEDULER_ENABLED:true}

  # 邮件为占位（未配置 MAIL_* 时发送降级为日志）；host 为空串仍会装配 JavaMailSender，
  # 故下方 management.health.mail.enabled=false，避免把 /actuator/health 拖成 503。
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.from: ${MAIL_FROM:}
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

mis:
  recon:
    scheduler:
      enabled: ${RECON_SCHEDULER_ENABLED:true}
    notify:
      # false（生产）= 渠道未配置时显式失败，避免"假成功"（P0-2）
      mock-enabled: false
      mail:
        to: ${RECON_NOTIFY_MAIL_TO:}
      webhook:
        url: ${RECON_NOTIFY_WEBHOOK_URL:}
    async:
      core-pool-size: 4
      max-pool-size: 16
      queue-capacity: 200
    cors:
      # 前端静态部署在 S2 10.254.26.34 的 /recon/ 子路径
      allowed-origins: ${RECON_CORS_ALLOWED_ORIGINS:http://10.254.26.34}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mis.recon: INFO
    org.springframework.scheduling.quartz: INFO
