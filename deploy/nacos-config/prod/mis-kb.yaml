# Nacos config: mis-kb (prod)
# Knowledge base service (T8 engine connection config, see docs/backend/mis-kb-system-design.md S-04).
#
# prod MUST connect to a real engine: type=ragflow, base-url / api-key injected by ops via
# Nacos secrets or container env vars. NEVER write real keys into this file or commit them.
# Engine version pinned to v0.26.4 (see pinned-versions table in deploy/ragflow/README.md).
server:
  port: 8108

mis:
  kb:
    iam:
      base-url: ${MIS_KB_IAM_BASE_URL:http://mis-iam:8102}
    engine:
      type: ${MIS_KB_ENGINE_TYPE:ragflow}
      base-url: ${MIS_KB_ENGINE_BASE_URL:}
      api-key: ${MIS_KB_ENGINE_API_KEY:}
      # Platform-wide rerank model id, injected by ops; empty = rerank disabled platform-wide
      rerank-model-id: ${MIS_KB_RERANK_MODEL_ID:}

logging:
  level:
    com.mis.kb: INFO
