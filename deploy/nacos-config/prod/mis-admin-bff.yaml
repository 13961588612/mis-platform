# Nacos config: mis-admin-bff (prod)
# ASCII comments only. Fused-deploy ai-platform on docker network.
server:
  port: 8081

mis:
  bff:
    iam-discovery-enabled: true
    iam-service-id: mis-iam
    iam-base-url: http://mis-iam:8102
    org-discovery-enabled: true
    org-service-id: mis-org
    org-base-url: http://mis-org:8103
    system-discovery-enabled: true
    system-service-id: mis-system
    system-base-url: http://mis-system:8105
    audit-discovery-enabled: true
    audit-service-id: mis-audit
    audit-base-url: http://mis-audit:8106
    auth-discovery-enabled: true
    auth-service-id: mis-auth
    auth-base-url: http://mis-auth:8101
    kb-discovery-enabled: true
    kb-service-id: mis-kb
    kb-base-url: http://mis-kb:8108
    aggregate-timeout-ms: 3000
    default-password: ${MIS_DEFAULT_PASSWORD:}
  api-permission:
    enabled: true
    # SEC-01: prod already fail-closed (commit 6db58b0). V32 registers KB 28 endpoints; keep true.
    deny-unmapped: true
    refresh-interval-seconds: 300
  ai-platform:
    base-url: ${AI_PLATFORM_BASE_URL:http://ai-platform-backend:8000}
    enabled: true
    chat-timeout-ms: 60000
    sse-enabled: ${AI_PLATFORM_SSE_ENABLED:true}
    health-check-interval-ms: 15000
    features:
      chat: true
      summary: true
      extract: true
      rag: true
      nl2sql: false
    reverse-trust-enabled: ${AI_PLATFORM_REVERSE_TRUST_ENABLED:true}
    service-token: ${AI_PLATFORM_BFF_SHARED_SECRET:}
    trusted-network: ${AI_PLATFORM_TRUSTED_NETWORK:}
    mis-jwt-issuer: ${MIS_JWT_ISSUER:mis-platform}
    mis-jwt-public-key: ${MIS_JWT_PUBLIC_KEY:}
    doc-service-base-url: ${AI_PLATFORM_DOC_SERVICE_BASE_URL:}
  agent-ops:
    backend-base-url: ${AGENT_OPS_BACKEND_BASE_URL:http://ai-platform-backend:8000}
    gateway-base-url: ${AGENT_OPS_GATEWAY_BASE_URL:http://ai-platform-gateway:3100}
    timeout-ms: ${AGENT_OPS_TIMEOUT_MS:15000}
    chat-timeout-ms: ${AGENT_OPS_CHAT_TIMEOUT_MS:180000}
  mcp:
    servers:
      org: http://mis-org:8103
      system: http://mis-system:8105
      iam: http://mis-iam:8102
