# Nacos config: mis-admin-bff (prod)
# Fused-deploy ai-platform adapter params (DEP-5). prod: sse-enabled=true.
mis:
  ai-platform:
    base-url: http://ai-platform-backend:8000
    enabled: true
    chat-timeout-ms: 60000
    sse-enabled: true
    health-check-interval-ms: 15000
    features:
      chat: true
      summary: true
      extract: true
      rag: true
      nl2sql: false
