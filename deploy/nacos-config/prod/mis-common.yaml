# Shared config for all services (prod bare-metal S1–S5).
# Topology in Nacos; secrets: set real values in Nacos console after push (or env override).
# Do NOT commit real production passwords to Git.

spring:
  datasource:
    url: "jdbc:postgresql://10.254.26.36:5432/mis_platform?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10"
    username: mis
    # Fill in Nacos console after push (quote if value contains #: "mis#1014"),
    # or export DB_PASSWORD on host
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 25000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
      connection-init-sql: "SET application_name = '${spring.application.name}'"
      validation-timeout: 5000
  data:
    redis:
      host: 10.254.26.36
      port: 6379
      database: 0
      # password: ${REDIS_PASSWORD:}   # enable if Redis AUTH is on
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Shanghai

mis:
  security:
    jwt:
      # Shared key dir on every app host
      public-key-path: /usr/local/app/keys/public.pem
