# Nacos config: mis-kb (integration)
# Engine type: ragflow | mock | noop
# Keep comments ASCII-only: Windows JVM default charset can break UTF-8 Chinese
# in Nacos YAML parse (MalformedInputException -> fall back to local noop).
server:
  port: 8108

mis:
  kb:
    # IAM: required for TENANT_ADMIN global-admin short-circuit (category manage scope).
    # Empty => KbSubjectClient returns no roles => every node looks "out of scope".
    iam:
      base-url: ${MIS_KB_IAM_BASE_URL:http://127.0.0.1:8102}
    engine:
      # Same docker network as deploy/ragflow: use http://ragflow:80
      type: ${MIS_KB_ENGINE_TYPE:ragflow}
      base-url: ${MIS_KB_ENGINE_BASE_URL:http://10.254.16.6:9380}
      # SECURITY: never commit a real api-key. Inject via env/Nacos secret at deploy time.
      api-key: ${MIS_KB_ENGINE_API_KEY:}
      # Platform-wide rerank model id (library keeps only on/off). Empty = disable rerank.
      # Fully-qualified name@instance@provider required by RAGFlow (bare name -> code:100).
      rerank-model-id: ${MIS_KB_RERANK_MODEL_ID:qwen3-rerank@Tongyi-Qianwen@Tongyi-Qianwen}
