# Nacos config: mis-admin-bff (integration)
# Fused-deploy ai-platform adapter params (DEP-5). Push commands: see deploy/nacos-config/README.md.
#
# In-container base-url uses service name ai-platform-backend (path B joins Python backend:8000).
# sse-enabled=true enables SSE streaming (ai-platform exposes /api/v1/agents/{id}/chat/stream).
mis:
  ai-platform:
    base-url: http://127.0.0.1:8000
    enabled: true
    chat-timeout-ms: 60000
    sse-enabled: true
    health-check-interval-ms: 15000
    features:
      chat: true
      summary: true
      extract: true
      rag: true
      nl2sql: false
