# Nacos config: mis-admin-bff (integration)
# Fused-deploy ai-platform adapter params (DEP-5). Push: scripts/nacos-push.ps1
#
# Keep comments ASCII-only (Windows JVM / Nacos YAML charset).
server:
  port: 8081

mis:
  ai-platform:
    # Local Agent Core; Docker fused-deploy uses http://ai-platform-backend:8000
    base-url: http://127.0.0.1:8000
    enabled: true
    chat-timeout-ms: 60000
    sse-enabled: true
    health-check-interval-ms: 15000
    features:
      chat: true
      summary: true
      extract: true
      rag: true
      nl2sql: false
  agent-ops:
    backend-base-url: http://127.0.0.1:8000
    gateway-base-url: http://127.0.0.1:3100
    timeout-ms: 15000
    # Coordinator->Worker multi-hop often exceeds 60s
    chat-timeout-ms: 180000
