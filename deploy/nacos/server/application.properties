# Nacos Server — PostgreSQL 外置存储（容器内主机名 postgres）
# 手工本机部署请用 application-native-pg.properties（localhost）

spring.sql.init.platform=postgresql

db.num=1
db.url.0=jdbc:postgresql://postgres:5432/nacos?tcpKeepAlive=true&reWriteBatchedInserts=true&ApplicationName=nacos
db.user.0=nacos
db.password.0=mis#nacos1014
db.pool.config.driverClassName=org.postgresql.Driver

db.pool.config.connectionTimeout=30000
db.pool.config.validationTimeout=10000
db.pool.config.maximumPoolSize=20
db.pool.config.minimumIdle=2

nacos.core.auth.enabled=false
# 生产请用环境变量 NACOS_AUTH_TOKEN（见 docker-entrypoint），勿把真实密钥提交进 Git。
# 若不用 env、只靠本文件：取消注释并填入 `openssl rand -base64 32` 的结果（解码后 ≥32 字节）。
