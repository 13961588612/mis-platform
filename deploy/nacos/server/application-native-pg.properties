# Nacos Server — PostgreSQL（本机手工部署，与 mis-auth 共用 JDK 17）
# 复制为 {NACOS_HOME}/conf/application.properties 后启动

spring.sql.init.platform=postgresql

db.num=1
db.url.0=jdbc:postgresql://127.0.0.1:5432/nacos?tcpKeepAlive=true&reWriteBatchedInserts=true&ApplicationName=nacos
db.user.0=nacos
db.password.0=nacos123
db.pool.config.driverClassName=org.postgresql.Driver

db.pool.config.connectionTimeout=30000
db.pool.config.validationTimeout=10000
db.pool.config.maximumPoolSize=20
db.pool.config.minimumIdle=2

nacos.core.auth.enabled=false
# 生产鉴权密钥见 docker-entrypoint 的 NACOS_AUTH_TOKEN；勿把真实密钥提交进 Git。
