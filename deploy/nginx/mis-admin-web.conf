# =============================================================================
# S2 生产边缘 — mis-admin-web 静态 + 双网关反代
# =============================================================================
# 主机：10.254.26.34（ai-portal）
# 安装示例：
#   sudo cp deploy/nginx/mis-admin-web.conf /etc/nginx/conf.d/mis-admin-web.conf
#   # 或 include 进 sites-enabled；改 server_name / ssl_certificate
#   sudo nginx -t && sudo systemctl reload nginx
#
# 静态根目录：/usr/local/app/mis-admin-web/dist（vite build 产物）
# 上游：
#   mis-gateway           127.0.0.1:8080  → /api/v1/**
#   ai-platform-gateway   127.0.0.1:3100  → /api/events /api/messages /ws
# =============================================================================

upstream mis_gateway_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream ai_gateway_upstream {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    server_name _;   # 生产改为实际域名

    root /usr/local/app/mis-admin-web/dist;
    index index.html;

    # 嵌入页 CSP（按实际父域改 frame-ancestors；须与构建时 VITE_PARENT_ORIGINS 对齐）
    # add_header Content-Security-Policy "frame-ancestors 'self' https://parent.example.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ----- Agent Gateway（须写在通用 /api/ 之前）-----
    location /api/events {
        proxy_pass http://ai_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/messages {
        proxy_pass http://ai_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /ws {
        proxy_pass http://ai_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # ----- MIS API（mis-gateway → BFF / 领域服务）-----
    location /api/ {
        proxy_pass http://mis_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 长请求（问数等）
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # ----- 嵌入页：URL 保持 /embed/...，文件落到 embed.html -----
    location /embed {
        try_files $uri /embed.html;
    }

    # ----- SPA 静态 -----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
