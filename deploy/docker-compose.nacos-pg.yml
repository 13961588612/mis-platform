# =============================================================================
# Nacos PostgreSQL 外置存储叠加层（测试 / 联调）
# =============================================================================
# 依赖：先确保 PG 插件已下载、镜像已用 JDK17 构建
#   .\scripts\ensure-nacos-pg-plugins.ps1
#   docker compose -f deploy/docker-compose.dev.yml -f deploy/docker-compose.nacos-pg.yml build nacos
#   docker compose -f deploy/docker-compose.dev.yml -f deploy/docker-compose.nacos-pg.yml up -d nacos
#
# 与业务：MIS_REMOTE=true + NACOS_NAMESPACE=test|integration，客户端仍为 SCA 自带 nacos-client 2.3.2
# =============================================================================

services:
  nacos:
    build:
      context: ./nacos
      dockerfile: Dockerfile
      args:
        NACOS_VERSION: "2.3.2"
    image: mis-nacos:2.3.2-jdk17
    container_name: mis-nacos
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./nacos/nacos-standalone-pg.env
    environment:
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
      SPRING_DATASOURCE_PLATFORM: postgresql
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - mis-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
