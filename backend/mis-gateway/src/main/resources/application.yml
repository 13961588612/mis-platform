server:
  port: 8080

spring:
  application:
    name: mis-gateway
  config:
    # Boot 3 ConfigData: imported wins over this file; remote uses Nacos mis-common
    # local: MIS_REMOTE=false + optional; test/prod: NACOS_NAMESPACE=test|prod
    import:
      - optional:nacos:mis-common?group=${NACOS_CONFIG_GROUP:MIS_GROUP}&refreshEnabled=true
      - optional:nacos:${spring.application.name}?group=${NACOS_CONFIG_GROUP:MIS_GROUP}&refreshEnabled=true
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:10.254.16.6:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_CONFIG_GROUP:MIS_GROUP}
        file-extension: yaml
    gateway:
      httpclient:
        # 问数 / Agent chat 可达 180s；未配置时长请求可能被提前断连
        connect-timeout: 5000
        response-timeout: 180s
      discovery:
        locator:
          enabled: false
      routes:
        # /auth/me 由 BFF 聚合用户+权限，须优先于 mis-auth 通配
        - id: mis-auth-me
          uri: http://localhost:8081
          order: -20
          predicates:
            - Path=/api/v1/auth/me
        - id: mis-auth
          uri: http://localhost:8101
          order: -10
          predicates:
            - Path=/api/v1/auth/**
        - id: mis-audit
          uri: http://localhost:8106
          order: -9
          predicates:
            - Path=/api/v1/audit/**
        - id: mis-admin-bff
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.mis: DEBUG

mis:
  security:
    gateway:
      enabled: true
    jwt:
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
