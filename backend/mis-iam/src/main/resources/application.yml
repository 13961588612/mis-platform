server:
  port: 8102

spring:
  application:
    name: mis-iam
  datasource:
    # YAML 须加引号：& 否则会被当成 anchor
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10"
    username: ${DB_USER:mis}
    password: ${DB_PASSWORD:mis123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 25000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
      connection-init-sql: "SET application_name = '${spring.application.name}'"
      # 不设 connection-test-query，走 JDBC Connection.isValid()
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.iam: DEBUG

mis:
  iam:
    org-check-enabled: true
    org-discovery-enabled: false
    org-service-id: mis-org
    org-base-url: http://localhost:8103
    default-password: ${MIS_DEFAULT_PASSWORD:Mis@123456}
    system-discovery-enabled: false
    system-service-id: mis-system
    system-base-url: http://localhost:8105
    permissions-ttl-minutes: 15
