server:
  port: 8101

spring:
  application:
    name: mis-auth
  datasource:
    # YAML 须加引号：& 否则会被当成 anchor
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10"
    username: ${DB_USER:mis}
    password: ${DB_PASSWORD:mis123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 25000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
      connection-init-sql: "SET application_name = '${spring.application.name}'"
      # 不设 connection-test-query，走 JDBC Connection.isValid()
      validation-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

mis:
  auth:
    captcha-enabled: ${AUTH_CAPTCHA_ENABLED:true}
    captcha-ttl-seconds: 300
    captcha-length: 4
    captcha-chars: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
    max-login-failures: 5
    login-lock-seconds: 1800
    default-client-id: web
    refresh-cookie-prefix: mis_refresh_
    cookie:
      path: /
      same-site: Strict
      secure: ${AUTH_COOKIE_SECURE:false}
    audit-enabled: true
    audit-base-url: ${AUDIT_BASE_URL:http://localhost:8106}
    audit-discovery-enabled: false
    audit-service-id: mis-audit
    iam-discovery-enabled: false
    iam-service-id: mis-iam
    iam-base-url: ${IAM_BASE_URL:http://localhost:8102}
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      access-token-ttl-seconds: 7200
      refresh-token-ttl-seconds: 604800

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.auth: DEBUG
