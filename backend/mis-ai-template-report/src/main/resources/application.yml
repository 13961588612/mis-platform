server:
  port: 8110

spring:
  application:
    name: mis-ai-template-report
  config:
    import:
      - optional:nacos:mis-common?group=${NACOS_CONFIG_GROUP:MIS_GROUP}&refreshEnabled=true
      - optional:nacos:${spring.application.name}?group=${NACOS_CONFIG_GROUP:MIS_GROUP}&refreshEnabled=true
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER:10.254.16.6:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_CONFIG_GROUP:MIS_GROUP}
        file-extension: yaml
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10"
    username: ${DB_USER:mis}
    password: ${DB_PASSWORD:mis123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 25000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
      connection-init-sql: "SET application_name = '${spring.application.name}'"
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mis:
  ai-report:
    iam:
      base-url: ${MIS_AI_REPORT_IAM_BASE_URL:http://127.0.0.1:8102}
