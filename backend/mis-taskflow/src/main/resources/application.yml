server:
  port: 8104

spring:
  application:
    name: mis-taskflow
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10"
    username: ${DB_USER:mis}
    password: ${DB_PASSWORD:mis123}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 25000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 15000
      connection-init-sql: "SET application_name = '${spring.application.name}'"
      validation-timeout: 5000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.taskflow: DEBUG

# 消息附件与正文图片。本地 MinIO 默认与 deploy/docker-compose.dev.yml 一致。
mis:
  message:
    storage:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_MESSAGE_BUCKET:mis-message}