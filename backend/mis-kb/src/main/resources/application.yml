server:
  port: 8108

spring:
  application:
    name: mis-kb
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}
    username: ${DB_USER:mis}
    password: ${DB_PASSWORD:mis123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

mis:
  kb:
    engine:
      # 全局重排模型 ID（WA-05）。空 = 全平台禁用 rerank：
      # capabilities.rerankSupported=false → 前端置灰 → 保存强制 false → 检索期再降级。
      rerank-model-id: ${MIS_KB_RERANK_MODEL_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.kb: DEBUG
