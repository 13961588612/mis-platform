server:
  port: 8108

spring:
  application:
    name: mis-kb
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}
    username: ${DB_USER:mis}
    password: ${DB_PASSWORD:mis123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

mis:
  kb:
    # IAM 直连：管辖判定要查用户角色码（TENANT_ADMIN 全局短路）。
    # 未配置时 KbSubjectClient 降级空列表 → 租户管理员也会被当成「无管辖」。
    iam:
      base-url: ${MIS_KB_IAM_BASE_URL:http://localhost:8102}
    engine:
      # 全局重排模型 ID（WA-05）。空 = 全平台禁用 rerank：
      # capabilities.rerankSupported=false → 前端置灰 → 保存强制 false → 检索期再降级。
      rerank-model-id: ${MIS_KB_RERANK_MODEL_ID:}
      # 引擎是否支持在线删除知识库（dataset）。Q5：写死配置，不做启动探测。
      # 默认 true（增量 P0-T01：线上 RAGFLOW 已支持官方批量删除接口
      # DELETE /api/v1/datasets + {"ids":[...]}）；某环境版本仍不支持时把本开关翻 false
      # 即恢复「物理删除被拒(40934)、只能归档」的降级，代码分支无需改动。
      delete-supported: ${MIS_KB_ENGINE_DELETE_SUPPORTED:true}
      # RAPTOR 平台总开关（Wave C，U4 裁定）。默认 true；Nacos 可热调，无需重启。
      # false ⇒ capabilities.raptorSupported=false → 前端置灰 → 保存强制 useRaptor=false
      #          → 触发构建抛 KB_RAPTOR_UNSUPPORTED（40960）。无库数上限。
      raptor-enabled: ${MIS_KB_RAPTOR_ENABLED:true}
      reconcile:
        # 定时对账总开关。刻意不用 @ConditionalOnProperty（那样只能重启生效），
        # 定时方法体第一行读本值直接 return，支持 Nacos 热关。
        enabled: ${MIS_KB_RECONCILE_ENABLED:true}
        # 定时间隔（毫秒），默认 5 分钟。
        interval-ms: ${MIS_KB_RECONCILE_INTERVAL_MS:300000}
        # listDatasets 分页大小。
        page-size: ${MIS_KB_RECONCILE_PAGE_SIZE:100}
        # 分页拉取硬上限，防引擎侧 dataset 巨多时打爆。
        max-pages: ${MIS_KB_RECONCILE_MAX_PAGES:50}
        # ShedLock 持锁时长（ISO-8601 Duration）。
        lock-at-most-for: ${MIS_KB_RECONCILE_LOCK_AT_MOST:PT10M}
        lock-at-least-for: ${MIS_KB_RECONCILE_LOCK_AT_LEAST:PT30S}
        # 连续被标记 MISSING_IN_ENGINE 达到此次数（按 interval-ms 计）后，手动/自动收敛才清理（默认 2）。
        missing-in-engine-threshold: ${MIS_KB_RECONCILE_MISSING_THRESHOLD:2}
        # 定时对账是否自动收敛清理 MISSING_IN_ENGINE 残留（库软删 + 孤儿文档物理删）。默认 false（仅手动端点）。
        auto-clean-missing: ${MIS_KB_RECONCILE_AUTO_CLEAN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.kb: DEBUG
