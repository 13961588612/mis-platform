server:
  port: 8081

spring:
  application:
    name: mis-admin-bff
  datasource:
    # D12：嵌入身份兑换直读共享平台库（agent_external_host / agent_external_identity）
    # 与 mis-iqd 等一致：优先 SPRING_DATASOURCE_*，否则走 DB_HOST/DB_USER（.env.integration）
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mis_platform}?tcpKeepAlive=true&ApplicationName=${spring.application.name}&loginTimeout=10}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.adminbff: DEBUG

mis:
  # D12：嵌入身份兑换端点的 RS256 MIS JWT 签发（与 mis-auth 同签名体系/同密钥对；
  # 私钥由部署侧挂载 PEM 文件路径注入，未配置则兑换端点 fail-closed 返回 40303）
  security:
    jwt:
      private-key-path: ${MIS_JWT_PRIVATE_KEY_PATH:}
      access-token-ttl-seconds: ${MIS_JWT_ACCESS_TOKEN_TTL:1800}
  embed:
    # 宿主共享密钥（hostId → client_secret 明文，用于 externalToken HS256 验签）。
    # 与 agent_external_host.client_secret_hash（sha256）交叉校验；生产务必用环境变量覆盖。
    # 文档：docs/integration/embed-copilot.md
    client-secrets:
      embed-demo: ${MIS_EMBED_HOST_EMBED_DEMO_CLIENT_SECRET:embed-demo-local-secret-do-not-use-in-prod}
    # phone_hash 加盐（R5 脱敏存储；空 = 不加盐）
    salt: ${MIS_EMBED_PHONE_HASH_SALT:}
    # 手机号匹配开关（03 §5.2 phone_match_enabled 默认 true）
    phone-match-enabled: ${MIS_EMBED_PHONE_MATCH_ENABLED:true}
    # 兑换限流：同一 hostId 每分钟最大请求数（R6 防撞库）
    rate-limit-per-minute: ${MIS_EMBED_RATE_LIMIT_PER_MINUTE:60}
  bff:
    iam-discovery-enabled: false
    iam-service-id: mis-iam
    iam-base-url: http://localhost:8102
    org-discovery-enabled: false
    org-service-id: mis-org
    org-base-url: http://localhost:8103
    system-discovery-enabled: false
    system-service-id: mis-system
    system-base-url: http://localhost:8105
    audit-discovery-enabled: false
    audit-service-id: mis-audit
    audit-base-url: http://localhost:8106
    auth-discovery-enabled: false
    auth-service-id: mis-auth
    auth-base-url: http://localhost:8101
    kb-discovery-enabled: false
    kb-service-id: mis-kb
    kb-base-url: http://localhost:8108
    # 文档上传走 multipart 透传，比普通聚合慢，单独放宽超时
    aggregate-timeout-ms: 3000
    default-password: ${MIS_DEFAULT_PASSWORD:Mis@123456}
    # 老 SMP 共享：鉴权头 + auth-service 令牌兑换（多下游复用，ADR-021）
    smp:
      exchange-timeout-ms: ${SMP_TOKEN_EXCHANGE_TIMEOUT_MS:5000}
      auth:
        header-name: ${SMP_AUTH_HEADER:HC-SMP-Authorization}
        header-prefix: ""
      token-exchange:
        enabled: ${SMP_TOKEN_EXCHANGE_ENABLED:true}
        token-url: ${SMP_TOKEN_URL:}
        client-id: ${SMP_CLIENT_ID:mis-admin-bff}
        client-secret: ${SMP_CLIENT_SECRET:}
        audience: ${SMP_TOKEN_AUDIENCE:}
        token-json-path: "$.data.token"
        fail-closed: true
        cache:
          enabled: true
          key-prefix: "bff:smp-token:user:"
          skew-seconds: 60
    # bip-bank-receipt 下游专用
    bank-receipt:
      base-url: ${BANK_RECEIPT_BASE_URL:http://127.0.0.1:11119/bip-bank-receipt}
      connect-timeout-ms: ${BANK_RECEIPT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${BANK_RECEIPT_READ_TIMEOUT_MS:60000}
      audience: bip-bank-receipt
  api-permission:
    enabled: true
    # SEC-01：本地对齐 fail-closed（与 test/integration/prod 一致，技术债 11.3 销账）。
    # 未登记 sys_api 的端点将 403「接口未授权映射」。
    # 本地开发逃生口：MIS_API_PERMISSION_DENY_UNMAPPED=false 可临时放行未登记端点。
    deny-unmapped: ${MIS_API_PERMISSION_DENY_UNMAPPED:true}
    refresh-interval-seconds: 300
  ai-platform:
    # 本地默认 127.0.0.1（避免 Windows 上 localhost→::1 而 Agent 仅听 IPv4）；Docker/Nacos 用服务名覆盖（R1）。
    base-url: ${AI_PLATFORM_BASE_URL:http://127.0.0.1:8000}
    enabled: true
    chat-timeout-ms: ${AI_PLATFORM_CHAT_TIMEOUT_MS:180000}
    # 前端 Copilot 固定 stream:true；本地默认开启，否则 Accept:text/event-stream 与 Result JSON 协商会 500
    sse-enabled: ${AI_PLATFORM_SSE_ENABLED:true}
    health-check-interval-ms: 15000
    features:
      chat: true
      summary: true
      extract: true
      rag: true
      nl2sql: false
    # ===== 反向调用信任（决策3 / Q3，design §7.2 / §8.2）=====
    # 因子一：与 ai-platform 共享的服务凭证（对应请求头 X-Platform-Token）
    reverse-trust-enabled: ${AI_PLATFORM_REVERSE_TRUST_ENABLED:true}
    service-token: ${AI_PLATFORM_BFF_SHARED_SECRET:change-me-in-prod}
    # 因子三：ai-platform 来源网段（CIDR，如 10.20.0.0/16）；为空表示仅靠 service-token 作闸门
    trusted-network: ${AI_PLATFORM_TRUSTED_NETWORK:}
    # 因子二：委托 MIS JWT 验签
    mis-jwt-issuer: ${MIS_JWT_ISSUER:mis-platform}
    # 因子二：验签 X-Mis-Upstream-Jwt 的 MIS RSA 公钥（PEM，BEGIN/END 包裹）
    mis-jwt-public-key: ${MIS_JWT_PUBLIC_KEY:}
    # 单据写回目标微服务基址（DocWriteHandler 复用，design §9.2.1）
    doc-service-base-url: ${AI_PLATFORM_DOC_SERVICE_BASE_URL:}
  agent-ops:
    # 智能体运营控制台（impl-plan §9.2）。§4.3 的 58 条端点里 57 条落 backend，
    # 仅 #54「企微 Bot 健康」落 gateway —— 两者是不同进程不同端口，不可合并。
    # 本地默认 127.0.0.1（Windows 上 localhost 会先解析 ::1，而 uvicorn 只听 IPv4）。
    backend-base-url: ${AGENT_OPS_BACKEND_BASE_URL:http://127.0.0.1:8000}
    # ⚠ 端口取 3100（spec.md §2.1 口径）；impl-plan §9.2 示例片段写的是 3000，已列为文档待订正项。
    gateway-base-url: ${AGENT_OPS_GATEWAY_BASE_URL:http://127.0.0.1:3100}
    # 启停 Agent / 重建索引 / 连接 MCP 都涉及真实进程与网络初始化，3s（aggregate-timeout-ms）会误判超时
    timeout-ms: ${AGENT_OPS_TIMEOUT_MS:15000}
    # 对话消息背后是一次完整 LLM 推理（运营台本地对话还可能经 Coordinator→Worker 多跳），
    # 60s 在委派场景会常态误判超时（BFF 先断、下游仍在跑）。默认放宽到 180s，可用环境变量覆盖。
    chat-timeout-ms: ${AGENT_OPS_CHAT_TIMEOUT_MS:180000}
  mcp:
    servers:
      org: http://localhost:8103
      system: http://localhost:8105
      iam: http://localhost:8102
  iqd:
    # 问数（IQD）mis-iqd 服务基址（本地默认 127.0.0.1；Docker/Nacos 用服务名覆盖）
    base-url: ${MIS_IQD_BASE_URL:http://127.0.0.1:8109}
    timeout-ms: ${MIS_IQD_TIMEOUT_MS:5000}
    # 问数 SSE 总开关：关闭后 ask-stream 回退非流式缓冲
    sse-enabled: ${MIS_IQD_SSE_ENABLED:true}
    # 问数单次请求超时（含 Worker 完整编排链，默认 180s）
    ask-timeout-ms: ${MIS_IQD_ASK_TIMEOUT_MS:180000}
    # admin 视图权限码：持有者 ask 时 view=admin（含 SQL），否则 view=user（剥 SQL 键）
    admin-view-permission: ${MIS_IQD_ADMIN_VIEW_PERMISSION:iqd:trace:view}
    # 管理面代理功能权限码
    config-view-permission: ${MIS_IQD_CONFIG_VIEW_PERMISSION:iqd:config:view}
    config-save-permission: ${MIS_IQD_CONFIG_SAVE_PERMISSION:iqd:config:save}
    config-test-permission: ${MIS_IQD_CONFIG_TEST_PERMISSION:iqd:config:test}
    # 问数功能权限码（ask / ask-stream 双闸门之一，无则 40300）
    ask-permission: ${MIS_IQD_ASK_PERMISSION:ai:chat:use}
    # Worker 侧 mis-iqd Agent 的 agentId（ai-platform Agent Core 注册名）
    agent-id: ${MIS_IQD_AGENT_ID:mis-iqd}
    # MDL 写回平台默认开关（连接级 mdl_writeback_enabled 仍可在配置页单独关闭）
    mdl-writeback-enabled: ${MIS_IQD_MDL_WRITEBACK_ENABLED:true}
