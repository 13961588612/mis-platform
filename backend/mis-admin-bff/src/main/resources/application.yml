server:
  port: 8081

spring:
  application:
    name: mis-admin-bff
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.mis.adminbff: DEBUG

mis:
  bff:
    iam-discovery-enabled: false
    iam-service-id: mis-iam
    iam-base-url: http://localhost:8102
    org-discovery-enabled: false
    org-service-id: mis-org
    org-base-url: http://localhost:8103
    system-discovery-enabled: false
    system-service-id: mis-system
    system-base-url: http://localhost:8105
    audit-discovery-enabled: false
    audit-service-id: mis-audit
    audit-base-url: http://localhost:8106
    auth-discovery-enabled: false
    auth-service-id: mis-auth
    auth-base-url: http://localhost:8101
    kb-discovery-enabled: false
    kb-service-id: mis-kb
    kb-base-url: http://localhost:8108
    # 文档上传走 multipart 透传，比普通聚合慢，单独放宽超时
    aggregate-timeout-ms: 3000
    default-password: Mis@123456
  api-permission:
    enabled: true
    deny-unmapped: false
    refresh-interval-seconds: 300
  ai-platform:
    # 本地默认 127.0.0.1（避免 Windows 上 localhost→::1 而 Agent 仅听 IPv4）；Docker/Nacos 用服务名覆盖（R1）。
    base-url: ${AI_PLATFORM_BASE_URL:http://127.0.0.1:8000}
    enabled: true
    chat-timeout-ms: 60000
    # 前端 Copilot 固定 stream:true；本地默认开启，否则 Accept:text/event-stream 与 Result JSON 协商会 500
    sse-enabled: ${AI_PLATFORM_SSE_ENABLED:true}
    health-check-interval-ms: 15000
    features:
      chat: true
      summary: true
      extract: true
      rag: true
      nl2sql: false
    # ===== 反向调用信任（决策3 / Q3，design §7.2 / §8.2）=====
    # 因子一：与 ai-platform 共享的服务凭证（对应请求头 X-Platform-Token）
    reverse-trust-enabled: ${AI_PLATFORM_REVERSE_TRUST_ENABLED:true}
    service-token: ${AI_PLATFORM_BFF_SHARED_SECRET:change-me-in-prod}
    # 因子三：ai-platform 来源网段（CIDR，如 10.20.0.0/16）；为空表示仅靠 service-token 作闸门
    trusted-network: ${AI_PLATFORM_TRUSTED_NETWORK:}
    # 因子二：委托 MIS JWT 验签
    mis-jwt-issuer: ${MIS_JWT_ISSUER:mis-platform}
    # 因子二：验签 X-Mis-Upstream-Jwt 的 MIS RSA 公钥（PEM，BEGIN/END 包裹）
    mis-jwt-public-key: ${MIS_JWT_PUBLIC_KEY:}
    # 单据写回目标微服务基址（DocWriteHandler 复用，design §9.2.1）
    doc-service-base-url: ${AI_PLATFORM_DOC_SERVICE_BASE_URL:}
  mcp:
    servers:
      org: http://localhost:8103
      system: http://localhost:8105
      iam: http://localhost:8102
